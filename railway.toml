# ============================================================
# إعدادات Railway لمشروع Aider Agent
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
# أمر التشغيل
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8080} --workers 1"

# سياسة إعادة التشغيل
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# فحص الصحة
healthcheckPath = "/health"
healthcheckTimeout = 10

# عدد النسخ (للتطوير)
numReplicas = 1

# ============================================================
# إعدادات الشبكة
# ============================================================

[service]
port = 8080

# ============================================================
# متغيرات البيئة (قيم افتراضية)
# ============================================================

[env]
WORKSPACE_DIR = "/workspace"
PORT = "8080"
HOST = "0.0.0.0"
LOG_LEVEL = "INFO"
PYTHONPATH = "/app"
CORS_ORIGINS = "*"

# سيتم تعيين هذه المتغيرات من لوحة تحكم Railway:
# AGENT_API_TOKEN = "your-secret-token"
# OPENAI_API_KEY = "sk-..."
# AIDER_MODEL = "openai/gpt-4o-mini"

# ============================================================
# إعدادات الموارد (للتطوير - يمكن تعديلها حسب الحاجة)
# ============================================================

[resources]
cpu = "0.5"
memory = "512MB"

# ============================================================
# وحدات التخزين (Volumes) - هام جداً!
# ============================================================

[[volumes]]
mountPath = "/workspace"
name = "workspace-data"
size = "5GB"
